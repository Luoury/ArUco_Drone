# 多工位巡回演示（TOUR 模式）参数
#
# 场景：基站（原点，arucotag id=0）+ 三个工位（id=1/2/3），由
# scripts/spawn_course.sh 在运行中的世界里摆好：
#
#       C(0,2.5)     B(2.5,2.5)
#          ┌─────────┐
#          │         │
#      基地(0,0)    A(2.5,0)
#
# 无人机从基站起飞 → 依次飞到每个工位正上方 → 视觉降到该工位的码上 →
# 落地上锁后原地起飞 → 下一个工位 → 最后一站就是基站，落地上锁后收工。
mission_manager:
  ros__parameters:
    # 工位顺序：(x, y, z) 三元组，代码按三元组下标取值，长度必须是 3 的倍数。
    # 当前 z 由 tour_approach_alt 统一给（三元组里的 z 只是占位，保持与接口一致）。
    #   A(2.5,0) → B(2.5,2.5) → C(0,2.5) → 回基站(0,0)
    tour_stations: [2.5, 0.0, 2.0, 2.5, 2.5, 2.0, 0.0, 2.5, 2.0, 0.0, 0.0, 2.0]
    tour_approach_alt: 2.0      # m，飞到工位上方时保持的高度
    tour_goto_tol: 0.35         # m，判定"到站"的水平/三维误差
    tour_settle_hold: 1.0       # s，到站后稳定这么久才算真的停稳
    tour_goto_timeout: 45.0     # s，单站飞行超时（超了就直接尝试降落）
    tour_land_timeout: 90.0     # s，单站降落超时（超了就悬停放弃）
    tour_takeoff_alt: 2.0       # m，从工位再次起飞的目标高度
    tour_takeoff_timeout: 40.0  # s，单次起飞超时
