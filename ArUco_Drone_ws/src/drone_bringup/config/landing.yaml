# 视觉降落参数（需求书 §5.4 固定参数名与默认值，代码中不得出现魔法数字）
landing_controller:
  ros__parameters:
    align_alt: 2.5          # SEARCH 阶段爬升高度 [m]
    descend_speed: 0.30     # ALIGN 完成后下降速度 [m/s]
    final_speed: 0.12       # FINAL 阶段下降速度 [m/s]
    lateral_tol: 0.15       # 对准判定的水平误差阈值 [m]
    final_tol: 0.08         # FINAL 阶段水平误差阈值 [m]
    kp_xy: 0.8              # 像素误差 → 水平速度 的比例系数
    max_vel_xy: 0.6         # 水平速度上限 [m/s]
    lost_timeout: 0.5       # 码丢失多久算丢失 [s]
    search_yaw_rate: 0.3    # SEARCH 阶段偏航扫描角速度 [rad/s]
